project:
  output-dir: docs # "docs" is an important folder name for GitHub pages
  type: website
  execute-dir: project
  resources:
    - data/
    - _rmd_fa26/

website: 
  title: "PSYCH 420m Lab"
  search: true
  navbar: 
    pinned: true
    left:
      - href: index.qmd
        text: Labs
      - href: files/cheatsheet.qmd
        text: R Cheatsheet
      - href: presentations/casestudychecklist.qmd
        text: Case Study Checklist
  announcement: 
    icon: info-circle
    dismissable: false
    content: "**Alert** - No office hours Tuesday, Nov. 24th"
    type: primary
    position: below-navbar

execute:
  cache: true

#format:
  #html:
    #css: noAI.css
  
filters: 
  #- patches/after-header-note.lua
  - patches/filelink.lua

format:
  html:
    code-copy: false
    include-in-header:
      - text: |
          <style>
          /* Disables text selection across the entire website */
          * {
            -webkit-user-select: none !important;  /* Safari */
            -ms-user-select: none !important;      /* IE/Edge */
            user-select: none !important;          /* Standard */
          }
          /* Keep form fields usable (e.g., poll free-response boxes) */
          input, textarea, select, [contenteditable] {
            -webkit-user-select: text !important;
            user-select: text !important;
          }
          </style>
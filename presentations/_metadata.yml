format:
  containerstheme-revealjs:
    center: false
    touch: true
    incremental: true
    self-contained: false
    smaller: true
    scrollable: true
    fig-align: center
    chalkboard:
      theme: whiteboard
    preview-links: true
    #sc-sb-title: true
    conditional:
      admin-password: "mona420m"
    title-slide-attributes:
        data-state: "hide-menubar"
        data-background-color: "rgba(254, 248, 237, 1)"
    transition: slide
    section-divs: false
    menu: true
    simplemenu:
      barhtml:
        header: "<div class='menubar'><ul class='menu'></ul></div>"
      scale: 0.50
    filters:

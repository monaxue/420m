title: Monatheme
author: Mona Xue
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    revealjs:
      theme: [default, containers.scss, noAI.scss]
      include-after-body: 
        file: theme-bg.html
      filters:
        - iframe.lua
        - filelink.lua
        - after-header-note.lua
      include-in-header:
      text: |
        <script>
          // ── Required ──────────────────────────────────────────────
          window.POLL_SUPABASE_URL   = "https://YOUR_PROJECT.supabase.co";
          window.POLL_SUPABASE_ANON  = "YOUR_ANON_KEY";
          window.POLL_ADMIN_PASSWORD = "your-presenter-password";

          // ── Optional ──────────────────────────────────────────────
          // Claude API key for AI grading of free-response questions
          window.POLL_CLAUDE_API_KEY  = "sk-ant-...";

          // Default timer for all polls in seconds (0 = no timer)
          window.POLL_DEFAULT_TIMER   = 60;
        </script>
revealjs-plugins:
  - poll

